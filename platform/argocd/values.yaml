# Argo CD (chart argo-cd 10.15.0 = Argo CD v3.6.1)
# Used twice: by bootstrap.sh (first install) and by apps/argocd.yaml (self-management).
# Same file in both places = no drift when Argo CD adopts itself.

global:
  domain: argocd.local # UI reached with kubectl port-forward; no load balancer

configs:
  params:
    server.insecure: true # TLS is terminated by port-forward on your laptop
  cm:
    # Poll Git every 60s instead of the default 120s (faster demos).
    timeout.reconciliation: 60s
    # Make the parent "root" app wait until each child app is Healthy before the
    # next sync wave. Since Argo CD 1.8 this health check is off by default.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false # local admin user only (lab)

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
